name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        openmp: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libomp-dev
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOTORIOUS_FFT_OPENMP=${{ matrix.openmp }} \
            -DNOTORIOUS_FFT_BUILD_TESTS=ON \
            -DNOTORIOUS_FFT_VALIDATE_FFTW=ON \
            -DNOTORIOUS_FFT_BUILD_EXAMPLES=ON \
            -DNOTORIOUS_FFT_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build -j
      - name: Compile explicit x86 SIMD variants
        if: matrix.openmp == 'OFF'
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          common=(-O2 -D_POSIX_C_SOURCE=200112L -Wall -Wextra -Wpedantic -Werror -Iinclude)
          for isa in avx2 avx512; do
            simd=(-mavx2 -mfma)
            if [[ "$isa" == avx512 ]]; then simd+=(-mavx512f -mavx512dq); fi
            for standard in c99 c11; do
              "$CC" "${common[@]}" "${simd[@]}" -std="$standard" -DNOTORIOUS_FFT_IMPLEMENTATION \
                -c tests/consumer_r2r.c -o "build/consumer_${isa}_${standard}.o"
            done
            "$CC" "${common[@]}" "${simd[@]}" -std=c11 \
              -c tests/implementation_r2r.c -o "build/implementation_${isa}.o"
            "$CC" "${common[@]}" "${simd[@]}" -std=c11 -DNOTORIOUS_FFT_IMPLEMENTATION \
              -c tests/test_r2r_memory.c -o "build/memory_${isa}.o"
            "$CXX" "${common[@]}" "${simd[@]}" -std=c++17 -DNOTORIOUS_FFT_IMPLEMENTATION \
              -c tests/consumer_r2r.cpp -o "build/consumer_${isa}_cpp.o"
            "$CXX" "${common[@]}" "${simd[@]}" -std=c++17 \
              -c tests/consumer_r2r.cpp -o "build/declarations_${isa}_cpp.o"
          done
      - name: Test
        run: |
          OMP_NUM_THREADS=2 ctest --test-dir build --output-on-failure -j2
          ./build/example_basic
          ./build/example_fftw_compat

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFTW3
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev
      - name: Configure (ASan+UBSan)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DNOTORIOUS_FFT_OPENMP=OFF \
            -DNOTORIOUS_FFT_VALIDATE_FFTW=ON \
            -DNOTORIOUS_FFT_BUILD_BENCHMARKS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build and test
        run: |
          cmake --build build -j
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build --output-on-failure -j2

  single:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Single-precision compile check
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOTORIOUS_FFT_SINGLE=ON \
            -DNOTORIOUS_FFT_OPENMP=OFF \
            -DNOTORIOUS_FFT_BUILD_BENCHMARKS=OFF
          cmake --build build --target example_basic -j
          ./build/example_basic
